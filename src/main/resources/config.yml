
bstats:
  enabled: true

chunk-optimizer:
  enabled: false
  min-chunks: 2
  max-chunks: 12
  direction-bias-enabled: true
  speed-reduction: 2
  fast-travel-threshold: 1.2
  max-step-per-cycle: 2
  hysteresis-chunks: 1
  rate-limit-enabled: true
  min-step-cycles: 2
  async-chunk-prioritization: true

settings:
  tps-threshold: 16.0

  max-redstone-updates: 20

  armor-stand-limit-per-chunk: 15

  debug: false

  view-distance:
    min: 2
    max: 12
    tps-low: 15.0
    tps-high: 18.0
    recovery-margin: 1.0
    recovery-checks: 2
    check-interval-seconds: 20
    affect-send-distance: true

features:

  entity-culling:
    enabled: true
    max-distance: 48.0
    safety-distance: 8.0
    fov-dot-threshold: 0.15
    tick-interval: 5

  ram-fixer:
    enabled: true
    monitor-interval-seconds: 1
    interval-minutes: 5
    medium-threshold-percent: 65.0
    high-threshold-percent: 78.0
    critical-threshold-percent: 88.0
    auto-trim-threshold-percent: 78.0
    ghost-chunk-eviction: true
    dead-entity-sweep: true
    promotion-watchdog: true
    slice-budget-ms: 2
    ghost-chunk-safety-padding: 2
    allow-explicit-gc: true
    allow-emergency-gc: true
    gc-cooldown-seconds: 60
    manual-gc-after-sweep: true
    manual-gc-threshold-percent: 30.0
    manual-gc-delay-ticks: 20
    max-manual-chunk-unloads: 512

  plugin-lag-watcher:
    enabled: true
    notify-ops: true
    mspt-alert-threshold: 8.0
    alert-cooldown-seconds: 60
    sampling-interval-ticks: 10

  item-expiry:
    enabled: true
    lifetime-seconds: 180
    protect-named-items: true

  performance-analyzer:
    enabled: true

  memory-optimization:
    enabled: true
    scan-interval-seconds: 30
    trim-cooldown-seconds: 30

  autosave-optimizer:
    enabled: true
    disable-vanilla-autosave: true
    stagger-seconds-between-worlds: 10
    min-tps-to-save: 15.0

  anti-lag-machine: true

  armor-stand-limiter: true

  tnt-protection: true

  anti-tnt-chain: true

  nether-chunk-protection:
    enabled: true
    proactive-view-distance: true
    dampen-velocity: true

    block-teleport-to-roof: false
    warn-on-roof-join: false
    bypass-creative: true
    ignore-spectator: true
    trust-command-teleports: true
    trust-plugin-teleports: true
    log-violations: false

    roof-min-y: 127.0
    roof-default-view-distance: 4
    max-speed-bps: 70.0
    max-distance-rate-bps: 85.0
    max-chunk-rate-per-second: 8.0
    vehicle-speed-multiplier: 0.90
    max-instant-chunk-jump: 4
    max-traversed-chunks-window: 25
    max-unique-chunks-window: 20
    full-threshold-tps: 19.0
    minimum-threshold-tps: 15.0
    minimum-pressure-factor: 0.55
    min-horizontal-distance: 0.005

    soft-strike-limit: 2
    hard-strike-limit: 5
    max-strikes: 20
    strike-decay: 1
    soft-send-view-distance: 4
    hard-send-view-distance: 2

    sample-interval-ms: 75
    window-ms: 4000
    strike-decay-ms: 10000
    violation-debounce-ms: 300
    recovery-delay-ms: 3000
    teleport-grace-ms: 1500

    messages:
      warning: "&8[&6NoLag&8] &eNether roof traversal speed is throttled to preserve server performance."
      roof: "&8[&6NoLag&8] &cNether roof traversal limit triggered."

  fluid-flood-protection:
    enabled: true
    protect-flow: true
    protect-ice: true
    protect-dispenser-flood: true
    protect-flying-machine-flood: true
    adaptive-limits: true
    neutralize-fluid: true
    neutralize-ice: true
    break-machine-components: true
    log-violations: false
    player-messages: true
    bypass-permission: "nolag.flood.bypass"

    max-flow-cells-per-world: 128
    max-tracked-source-blocks: 32
    flow-analysis-interval-ms: 200
    flow-window-ms: 1000
    flow-cell-ttl-ms: 6000
    watch-window-ms: 6000

    machine-inspection-radius: 2
    machine-track-radius: 10
    max-machine-tracks: 48
    machine-min-pulses: 3
    machine-pulse-window-ms: 1800
    machine-inspection-cooldown-ms: 250
    machine-track-ttl-ms: 4000
    machine-break-confidence: 9
    machine-neutralize-cooldown-ms: 5000

    flow-burst-threshold: 48
    critical-flow-burst-threshold: 96
    flow-burst-confidence-bonus: 32
    minimum-source-signals: 8
    emergency-throttle-ms: 3500
    emergency-chunk-radius: 1

    source-window-ms: 2500
    player-state-expire-ms: 90000
    player-source-burst-threshold: 12
    critical-source-burst-threshold: 20
    compact-source-threshold: 8
    source-compact-radius-blocks: 4
    player-source-confidence-bonus: 12

    dispenser-window-ms: 1200
    dispenser-ttl-ms: 10000
    dispenser-max-pulses: 10
    minimum-dispenser-redstone-signals: 2

    machine-component-radius: 3
    machine-component-limit: 12
    machine-clear-radius: 4
    vertical-duplication-y: 280


  fast-leaf-decay: true
  item-stacker: true
  void-teleport: true
  hopper-throttling: true
  dynamic-view-distance: true

  mob-stacker:
    enabled: true
    max-stack-size: 50
    min-mobs-to-stack: 8
    radius: 5.0
    check-interval: 3
    slice-budget-ms: 1.0

advanced-optimization:
  command-filter:
    enabled: true
    notify-admins: true
    admin-notify-message: "&e[NoLag] Player &c{player} &etried to use restricted command: &c/{command}"
    message: "&cThis command is restricted due to server lag and stability risk!"
    blocked-commands:
      - "fill"
      - "setblock"
      - "clone"
      - "worldedit"
      - "calc"
      - "eval"
      - "solve"
      - "reload"
      - "kill"

  physics-freeze-tps: 15.0

  elytra-protection:
    enabled: true
    tps-threshold: 15.0
    message: "&cElytra is disabled due to low server performance! (TPS: {tps})"

  hopper:
    heavy-throttling-tps: 14.0
    light-throttling-tps: 16.0

tnt-protection:
  max-primed-tnt-per-chunk: 25
  disable-explosion-fire: true
  yield-zero-threshold: 50
  yield-zero-value: 0.0

optimization:
  activation-range:
    enabled: true
    range: 48
    entities-per-run: 500

  chunk-cleaner:
    enabled: true
    interval-minutes: 8
    slice-budget-ms: 1
    safety-padding: 1
    budget-ms-per-tick: 2.0
    player-safe-margin: 2
    max-protection-radius: 40
    player-protection-refresh-ticks: 10
    max-examined-per-cycle: 250000
    max-unloads-per-cycle: 5000
    max-unloads-per-tick: 256
    time-check-every-chunks: 16
    pause-below-tps: 12.0
    half-budget-below-tps: 15.0
    disabled-worlds: []

atlas:
  lag-spike-threshold-ms: 150
  emergency-mspt: 55.0

messages:
  prefix: "&8[&6NoLag&8] &r"
  reload-success: "&aConfiguration successfully reloaded!"
  no-permission: "&cYou do not have permission to use this command!"
  armor-limit-reached: "&cThis chunk has reached the Armor Stand limit (%limit%)!"
  low-tps-warning: "&4&lWARNING! &cLow TPS detected (&e%tps%&c). Emergency optimization starting..."
  mob-separated: "&8[&6NoLag&8] &7- One mob separated! Remaining: &e%amount%"

  flood:
    violation: "&eExcessive fluid activity was blocked."
    severe-violation: "&cSuspicious fluid activity was blocked."
    machine-neutralized: "&cA suspicious fluid machine was neutralized."
